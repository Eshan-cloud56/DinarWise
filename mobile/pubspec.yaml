name: dinarwise
description: Localized household finance for Saudi Arabia and the GCC.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  cryptography: ^2.9.0
  csv: ^8.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  drift: ^2.22.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  hijri: ^3.0.1
  image: ^4.7.2
  image_picker: ^1.2.3
  intl: ^0.20.2
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.12.0
  quick_actions: ^1.1.0
  shared_preferences: ^2.3.3
  sqlite3_flutter_libs: ^0.5.28
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  video_player: ^2.10.1
  timezone: ^0.11.1
  firebase_core: ^4.13.0
  firebase_analytics: ^12.4.6
  firebase_crashlytics: ^5.2.7
  firebase_performance: ^0.11.4+6

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/DinarWise-Splash-Animation.mp4
    - assets/branding/DinarWise-Splash-Poster.png
